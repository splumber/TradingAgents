name: Build Validation

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        echo "Installing dependencies from requirements.txt..."
        if ! pip install -r requirements.txt; then
          echo "Error: Failed to install dependencies from requirements.txt"
          echo "Please check the dependency versions and compatibility"
          exit 1
        fi
        echo "✓ All dependencies installed successfully"

    - name: Verify package installation
      run: |
        python -c "import tradingagents; print('✓ TradingAgents package imported successfully')"
        python -c "from tradingagents.default_config import DEFAULT_CONFIG; print('✓ Default config loaded successfully')"

    - name: Check package structure
      run: |
        python -c "from tradingagents.graph.trading_graph import TradingAgentsGraph; print('✓ TradingAgentsGraph can be imported')"

    - name: Run basic test (if test.py exists)
      run: |
        if [ -f test.py ]; then
          echo "Running test.py..."
          python test.py
        else
          echo "No test.py found, skipping"
        fi
      continue-on-error: true

  build-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build
    if: always()
    steps:
    - name: Build Summary
      run: |
        echo "Build validation completed for all Python versions"
        echo "Check individual job results above for details"
